# ==========================================================================
# DataAgent Pro — 生产编排（仅应用层：backend + frontend 镜像）
#
# 使用前提：
#   1. 已通过 GitHub Actions 将镜像发布到 Docker Hub：
#        <username>/data-agent-backend  <username>/data-agent-frontend
#   2. 基础设施（Redis/etcd/MinIO/Milvus/MySQL/PostgreSQL）已用
#      现有 docker-compose.yml 启动（同名网络 data-agent-net）。
#
# 启动方式：
#   export DOCKERHUB_USERNAME=<你的用户名>
#   docker-compose -f docker-compose.prod.yml up -d
#
# 后端通过 env_file 复用根目录 .env 中的连接配置（LLM/Redis/Milvus/DB）。
# ==========================================================================
version: "3.8"

services:
  backend:
    image: ${DOCKERHUB_USERNAME}/data-agent-backend:latest
    container_name: data-agent-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - data-agent-net

  frontend:
    image: ${DOCKERHUB_USERNAME}/data-agent-frontend:latest
    container_name: data-agent-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - data-agent-net

networks:
  data-agent-net:
    driver: bridge
    name: data-agent-net
