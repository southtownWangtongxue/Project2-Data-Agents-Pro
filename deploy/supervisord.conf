; ==========================================================================
; DataAgent Pro 单体容器 — supervisord 配置
; 同时管理两个进程：nginx（前端静态 + 反代）与 uvicorn（FastAPI 后端）
; ==========================================================================
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:backend]
command=/app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PATH="/app/.venv/bin:/usr/local/bin:/usr/bin:/bin"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
