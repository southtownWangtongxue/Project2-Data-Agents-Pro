# ==========================================================================
# DataAgent Pro — 生产编排（单文件全量部署）
#
# 一条命令拉起全部服务（基础设施 + 应用单体容器）：
#   export DOCKERHUB_USERNAME=<你的用户名>
#   export IMAGE_TAG=latest          # 或发布版本号，如 v1.0.0
#   docker compose up -d
#
# 镜像：
#   ${DOCKERHUB_USERNAME}/data-agent:${IMAGE_TAG:-latest}
#   （由 GitHub Actions 自动构建发布，见 .github/workflows/docker-image.yml）
#
# 配置持久化（应用容器内卷，首次启动由 entrypoint 自动初始化默认配置）：
#   agent_configs   -> /app/configs              MCP/LLM/Skill 配置 JSON（watchdog 热更新）
#   agent_skills    -> /app/app/skills/skills    已安装的 Skill 实体目录
#   agent_resources -> /app/resources            资源文件
#   agent_logs      -> /app/app/logs             运行日志
#
# 提示：应用容器访问基础设施使用服务名（mysql/postgres/redis/milvus），
#       已通过 environment 覆盖 .env 中的 localhost 连接地址。
# ==========================================================================

services:
  # ==========================================================================
  # Redis - caching & message queue
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: data-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - data-agent-net

  # ==========================================================================
  # etcd - Milvus metadata store
  # ==========================================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: data-agent-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - data-agent-net

  # ==========================================================================
  # MinIO - Milvus object storage
  # ==========================================================================
  minio:
    image: minio/minio:latest
    container_name: data-agent-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - data-agent-net

  # ==========================================================================
  # Milvus - vector database
  # ==========================================================================
  milvus:
    image: milvusdb/milvus:v2.3.3
    container_name: data-agent-milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - data-agent-net

  # ==========================================================================
  # MySQL - relational database
  # ==========================================================================
  mysql:
    image: mysql:8.0
    container_name: data-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-business_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts/mysql-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - data-agent-net

  # ==========================================================================
  # PostgreSQL - relational database
  # ==========================================================================
  postgres:
    image: postgres:15
    container_name: data-agent-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-business_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - data-agent-net

  # ==========================================================================
  # 应用单体容器（前端 + 后端一体）
  # ==========================================================================
  app:
    image: ${DOCKERHUB_USERNAME}/data-agent:${IMAGE_TAG:-latest}
    container_name: data-agent-app
    env_file:
      - .env
    environment:
      # 容器内访问基础设施使用服务名，覆盖 .env 中的 localhost
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
    ports:
      - "80:80"
    volumes:
      - agent_configs:/app/configs
      - agent_skills:/app/app/skills/skills
      - agent_resources:/app/resources
      - agent_logs:/app/app/logs
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - data-agent-net

# ==========================================================================
# Persistent volumes
# ==========================================================================
volumes:
  redis_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local
  milvus_data:
    driver: local
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  # 应用配置持久化卷（entrypoint 首次启动自动初始化默认配置）
  agent_configs:
    driver: local
  agent_skills:
    driver: local
  agent_resources:
    driver: local
  agent_logs:
    driver: local

# ==========================================================================
# Shared network
# ==========================================================================
networks:
  data-agent-net:
    driver: bridge
    name: data-agent-net
