name: Publish Docker Images

# ==========================================================================
# DataAgent Pro — 镜像自动构建与发布到 Docker Hub
#
# 触发条件：
#   1. 推送 tag（v*，如 v1.2.0）→ 构建并推送 :v1.2.0 与 :latest
#   2. 手动触发（workflow_dispatch）
#
# 前置配置（GitHub 仓库 Settings → Secrets and variables → Actions）：
#   - DOCKERHUB_USERNAME  Docker Hub 用户名
#   - DOCKERHUB_TOKEN     Docker Hub Access Token（非登录密码）
#
# 产物镜像：
#   <username>/data-agent-backend
#   <username>/data-agent-frontend
# ==========================================================================
on:
  push:
    branches:
      - data_agent_pro
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # 多架构：amd64 与 arm64（若 arm64 编译慢或失败，可删除 arm64）
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 后端镜像 ────────────────────────────────────────────────
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/data-agent-backend
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 前端镜像 ────────────────────────────────────────────────
      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/data-agent-frontend
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
